# HyperCar —— 每次 push 自动构建**正式签名**的 Release APK；
# **提交信息带 `[release]`（或 `[publish]`）时才发布 GitHub Release**，其余 push 只进 Artifacts。
# **提交信息带 `[skip ci]` 时整条流水线不跑**（只改文档/注释时用）。
#
# 与 CarDeck CI 的差异：构建前多一步 **Rust 核心层交叉编译**（cargo-ndk →
# app/src/main/jniLibs/arm64-v8a/libhypercar_core.so），其余发布判定/签名闸门/
# 版本累计机制同款。
#
# 版本号与安装编号统一读取仓库根 version.properties；重跑不递增。
# 发布新版本前修改该文件并提交，本地和 CI 使用同一版本。
#
# 发布规则（两种触发）：
#   1. push 且**头提交**信息含 `[release]` / `[publish]`（必须在标题**末尾**）→ 构建后发布 Release（tag = v<版本>）
#   2. Actions 页手动 Run workflow 并勾选 publish → 同上（可用于补发历史构建）
#
# 必需 Secrets（Settings → Secrets and variables → Actions）：
#   KEYSTORE_BASE64    keystore 的 base64（单行无换行）
#                      Linux/macOS: base64 -w0 keystore.jks
#                      Windows:     [Convert]::ToBase64String([IO.File]::ReadAllBytes("keystore.jks"))
#   KEYSTORE_PASSWORD  storePassword
#   KEY_ALIAS          keyAlias
#   KEY_PASSWORD       keyPassword
# 可选：
#   EXPECTED_CERT_SHA256  额外签名指纹检查；无论是否配置，固定正式证书硬门禁始终生效。
#
# **没有 KEYSTORE_BASE64 会直接失败**，绝不退回 debug 签名：
# debug 证书签出去的包，日后换正式证书时所有用户必须卸载重装（签名是不可逆决定）。
# Gradle 侧还有第二道闸：正式构建缺少 keystore.properties 就构建失败。
name: Build Release APK

on:
  push:
    branches-ignore: ['alpha'] # alpha 由独立同步工作流检查、构建与预发布，避免重复出包
  workflow_dispatch:
    inputs:
      publish:
        description: '构建后发布 GitHub Release（补发历史构建时勾选）'
        type: boolean
        default: false

# 发布 Release 需要写权限（创建 tag / Release）
permissions:
  contents: write
  actions: write

concurrency:
  group: publish-colorplay-next
  cancel-in-progress: false

jobs:
  build:
    name: 构建正式签名 APK
    # 提交信息里带 [skip ci] 就整条流水线不跑（只改文档/注释时省 CI 时间）
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[metadata-only]')"
    runs-on: ubuntu-latest
    timeout-minutes: 55 # 比 CarDeck 多一步 Rust 交叉编译
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 发布判定放在最前：后面的步骤都按 publish 分流
      - name: 判定是否发布 Release
        id: meta
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          EVENT: ${{ github.event_name }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -eu
          publish=false
          if [ "$EVENT" = "workflow_dispatch" ]; then
            [ "${INPUT_PUBLISH:-false}" = "true" ] && publish=true
          else
            # 只看提交标题行，且标记必须在**末尾**（`feat: xxx [release]`）。
            # 不能在任何位置匹配：标题里顺带提到这个词的普通提交会被误发 Release。
            subject=$(printf '%s\n' "${HEAD_MESSAGE:-}" | head -n1)
            if printf '%s' "$subject" | grep -Eiq '\[(release|publish)\][[:space:]]*$'; then
              publish=true
            fi
            echo "头提交：$subject"
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "本次是否发布 Release：$publish"

      # AGP 8.5 要求 JDK 17，且与 app/build.gradle.kts 的 jvmTarget 一致
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ---- Rust 核心层（CarDeck CI 没有这一段）----
      - name: 安装 Rust（aarch64-linux-android 目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 安装 NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          link-to-sdk: true # 挂进 ANDROID_HOME/ANDROID_SDK_ROOT，cargo-ndk 自动发现

      - name: 缓存 cargo-ndk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ runner.os }}

      - name: 安装 cargo-ndk
        run: command -v cargo-ndk >/dev/null 2>&1 || cargo install cargo-ndk --locked

      - name: 缓存 rust-core 编译产物
        uses: actions/cache@v4
        with:
          path: |
            rust-core/target
          key: rust-core-${{ runner.os }}-${{ hashFiles('rust-core/Cargo.toml') }}
          restore-keys: rust-core-${{ runner.os }}-

      - name: Rust 全量单元测试
        working-directory: rust-core
        env:
          CMAKE_GENERATOR: Ninja
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
        run: cargo test --lib

      - name: 编译 Rust 核心层 → jniLibs
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          CMAKE_GENERATOR: Ninja
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
        run: |
          set -eu
          command -v cmake
          command -v ninja
          cd rust-core
          cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release
          ls -la ../app/src/main/jniLibs/arm64-v8a/
          test -f ../app/src/main/jniLibs/arm64-v8a/libhypercar_core.so

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      # build.gradle.kts 用 rootProject.file(storeFile) 解析，所以 .jks 与
      # keystore.properties 都放仓库根（两者都已 gitignore，不会被提交）
      - name: 写入签名配置
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          # 四个值缺一不可；缺了直接失败（绝不退回 debug 签名）
          MISSING=""
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v:-}" ]; then MISSING="$MISSING $v"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::缺少仓库 Secrets:$MISSING。到 ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/settings/secrets/actions 添加（KEYSTORE_BASE64 生成：PowerShell [Convert]::ToBase64String([IO.File]::ReadAllBytes('keystore.jks'))）。本流水线只出正式签名包，不会退回 debug 签名。"
            exit 1
          fi
          # 允许粘贴多行 base64（Windows 复制常见），解码前先去掉换行
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "签名材料已就绪（release.jks + keystore.properties）"

      - name: 计算版本号
        id: version
        env:
          PUBLISH: ${{ steps.meta.outputs.publish }}
        run: |
          set -eu
          python3 - <<'PYVERSION'
          import os, re
          from pathlib import Path
          values = dict(line.strip().split("=", 1) for line in Path("version.properties").read_text().splitlines()
                        if line.strip() and not line.lstrip().startswith("#"))
          version = values["versionName"].strip()
          code = int(values["versionCode"].strip())
          if ("-alpha." in version or os.environ.get("GITHUB_REF") == "refs/heads/alpha") and os.environ.get("PUBLISH") == "true":
              raise SystemExit("alpha 版本只能由独立 alpha 工作流预发布，禁止作为正式 Release 发布")
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:-(?:beta|alpha)\.[0-9]+)?", version) or not 1 <= code <= 2_100_000_000:
              raise SystemExit("Invalid version.properties")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"name={version}\ncode={code}\ntag=v{version}\n")
          print(f"本次版本：{version}（versionCode={code}，来自 version.properties）")
          PYVERSION

      - name: 防止发布版本号指向不同代码
        if: steps.meta.outputs.publish == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -eu
          refs=$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          existing=$(printf '%s\n' "$refs" | awk '/\^\{\}$/ {print $1; found=1} END {if (!found) exit 1}') || existing=$(printf '%s\n' "$refs" | awk 'NF {print $1; exit}')
          if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
            echo "::error::该版本已用于其它提交，请先递增 version.properties 中的 versionName 和 versionCode"
            exit 1
          fi

      # Windows 上生成的 gradlew 在 git 里可能没有执行位（core.fileMode=false），
      # checkout 到 Linux runner 后补一次 chmod
      - name: 构建 Release APK
        run: |
          set -eu
          chmod +x gradlew
          ./gradlew :app:lintRelease :app:testDebugUnitTest :app:assembleRelease -Phypercar.officialBuild=true --stacktrace

      - name: 校验签名并打包
        id: package
        env:
          VERSION: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          EXPECTED_CERT: ${{ secrets.EXPECTED_CERT_SHA256 }}
        run: |
          set -eu
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::未找到 $APK"; exit 1; }

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n1)
          test -n "$APKSIGNER" || { echo "::error::找不到 apksigner"; exit 1; }
          "$APKSIGNER" verify --print-certs "$APK" > certs.txt
          AAPT="$(dirname "$APKSIGNER")/aapt2"
          "$AAPT" dump badging "$APK" > badging.txt
          python3 - <<'PYIDENTITY'
          import os, re, zipfile
          from pathlib import Path
          expected = 'e367837a3305e5fceff996028355d3b2c3fff26260af5572d287d732d1472d66'
          normalize = lambda value: re.sub(r'[:\s]', '', value).lower()
          certs = Path('certs.txt').read_text()
          fingerprints = re.findall(r'^(?:Signer #\d+|V2 Signer:) certificate SHA-256 digest:[ \t]*([0-9a-fA-F: ]+)[ \t]*\r?$', certs, re.M)
          # 兼容不同 build-tools 的 Signer #1 与 V2 Signer 输出，拒绝多签名者。
          if len(fingerprints) != 1 or normalize(fingerprints[0]) != expected:
              raise SystemExit('正式签名证书缺失或不匹配')
          if 'CN=Android Debug' in certs:
              raise SystemExit('禁止 debug 证书')
          if os.environ.get('EXPECTED_CERT') and normalize(os.environ['EXPECTED_CERT']) != expected:
              raise SystemExit('EXPECTED_CERT_SHA256 与固定正式证书不一致')
          package = re.search(r"^package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'", Path('badging.txt').read_text(), re.M)
          if not package or package.groups() != ('com.emxxme.colorplaynext', os.environ['VERSION_CODE'], os.environ['VERSION']):
              raise SystemExit('APK 包名或版本与本次版本输出不一致')
          with zipfile.ZipFile('app/build/outputs/apk/release/app-release.apk') as apk:
              if apk.getinfo('lib/arm64-v8a/libhypercar_core.so').file_size <= 0:
                  raise SystemExit('APK Rust 核心层为空')
          Path('verified-cert.txt').write_text(expected)
          PYIDENTITY
          CERT=$(< verified-cert.txt)

          NAME="colorplay-next-${VERSION}-release.apk"
          cp "$APK" "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          SHA=$(cut -d' ' -f1 "$NAME.sha256")
          SIZE=$(du -h "$NAME" | cut -f1)
          {
            echo "name=$NAME"
            echo "sha=$SHA"
            echo "cert=$CERT"
            echo "size=$SIZE"
          } >> "$GITHUB_OUTPUT"
          echo "已生成 $NAME（$SIZE）"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.name }}
          if-no-files-found: error
          retention-days: 30
          overwrite: 'true' # 重跑同一 run 时版本号不变，覆盖旧产物而不是失败

      - name: 写入运行摘要
        env:
          VERSION: ${{ steps.version.outputs.name }}
          NAME: ${{ steps.package.outputs.name }}
          SHA: ${{ steps.package.outputs.sha }}
          CERT: ${{ steps.package.outputs.cert }}
          SIZE: ${{ steps.package.outputs.size }}
          PUBLISH: ${{ steps.meta.outputs.publish }}
        run: |
          set -eu
          {
            echo "### ColorPlay Next ${VERSION}（正式签名）"
            echo
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| APK | ${NAME} |"
            echo "| APK 大小 | ${SIZE} |"
            echo "| SHA-256 | ${SHA} |"
            echo "| 签名证书 SHA-256 | ${CERT} |"
            echo "| 发布 Release | ${PUBLISH} |"
            echo
            echo "安装：adb install -r ${NAME}"
            echo
            echo "> Artifacts 列表里显示的体积是**压缩包**大小（dex 在 APK 内不压缩，再打包会缩到约 45%）；"
            echo "> 解压后的 APK 体积见上表。"
          } >> "$GITHUB_STEP_SUMMARY"

      # 发布放在 Lint、单测和 APK 身份校验之后：任何门禁失败均禁止正式发布
      # 手动 workflow_dispatch + publish=true 同样必须通过测试。
      - name: 防止正式版安装编号低于 Alpha
        if: steps.meta.outputs.publish == 'true'
        env:
          RELEASE_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          # 不存在 alpha 可继续；网络/鉴权失败必须阻断，不能当作分支不存在。
          ALPHA_REF=$(git ls-remote --heads origin refs/heads/alpha)
          if [ -n "$ALPHA_REF" ]; then
            git fetch --no-tags origin refs/heads/alpha:refs/remotes/origin/alpha
            python3 - <<'PYALPHA'
          import os, re, subprocess
          text = subprocess.check_output(['git', 'show', 'refs/remotes/origin/alpha:version.properties'], text=True)
          values = dict(line.strip().split('=', 1) for line in text.splitlines()
                        if line.strip() and not line.lstrip().startswith('#'))
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+', values['versionName'].strip()):
              print('远程 alpha 尚无 Alpha 实验版本，跳过安装编号闸门')
              raise SystemExit(0)
          alpha_code = int(values['versionCode'].strip())
          release_code = int(os.environ['RELEASE_CODE'])
          if not 1 <= alpha_code <= 2_100_000_000:
              raise SystemExit('远程 alpha versionCode 无效，禁止正式发布')
          if release_code <= alpha_code:
              raise SystemExit(f'正式版 versionCode={release_code} 必须高于 alpha={alpha_code}；请先提高 main 的 versionCode，确保 Alpha 用户可覆盖安装回正式版')
          print(f'安装编号闸门通过：正式版 {release_code} > Alpha {alpha_code}')
          PYALPHA
          fi

      - name: 发布 GitHub Release
        if: steps.meta.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
          TAG: ${{ steps.version.outputs.tag }}
          NAME: ${{ steps.package.outputs.name }}
          SHA: ${{ steps.package.outputs.sha }}
          CERT: ${{ steps.package.outputs.cert }}
          SIZE: ${{ steps.package.outputs.size }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          # 本次发布的"更新说明"取**提交标题**（subject，即第一行）。
          # 用 git 读而不是 github.event.head_commit.message：后者是多行全文，
          # 且格式随触发方式（push / 手工补发）变化。
          # 注意：本块内不要出现 Actions 的表达式插值（双花括号），否则会先被
          # 替换成提交内容——多行内容会把这里撑成可执行的 shell 代码。
          SUBJECT=$(git log -1 --format=%s)
          UPSTREAM_BASE=$(python3 - <<'PYBASE'
          import re
          from pathlib import Path
          source = Path('app/src/main/java/io/github/hypercar/UpstreamBase.kt').read_text()
          values = {key: re.search(r'const val ' + key + r' = "([^"]+)"', source).group(1) for key in ('VERSION', 'COMMIT')}
          code = re.search(r'const val CODE = ([0-9]+)', source).group(1)
          print(values['VERSION'] + ' / code=' + code + ' / ' + values['COMMIT'])
          PYBASE
          )
          # 注意：这里是**未加引号**的 heredoc，会展开 $VAR；正文里不要出现反引号
          # （未引号 heredoc 里反引号是命令替换，会执行 adb 并把错误写进 notes）。
          # SUBJECT 里的反引号无此问题：变量展开的结果不会被再次求值。
          cat > notes.md <<EOF
          ColorPlay Next ${VERSION}（正式签名）

          **更新说明**：${SUBJECT}

          支持自绘 UI、CarWith、系统 CarLife+ 和新增 Car+ 等画面来源，通过无线 CarPlay / AirPlay 投送到车机。自绘模式使用 Kotlin / Compose 与 MediaCodec，Car+ 复用手机系统 CarLife 画面；Rust 负责协议协商与媒体转发，不要求 root。

          ### 当前功能

          - 高德／百度地图卡片与车联全屏布局，卡片和全屏共用地图任务，切换时保留导航。
          - 音乐专辑封面支持媒体元数据、URI 与通知大图回退；播放进度和控制保留，更多应用显示已安装的受支持音乐 App。
          - 白天 / 暗夜 / 自动主题、三套日夜壁纸、默认地图／音乐与连接自动播放设置；巡航由地图应用自身设置。
          - 返回车机系统使用 requestUI，保持 CarPlay 会话和音频通道，需接收端支持。
          - 系统播放采集 48kHz 双声道；真正断连先暂停音乐，音频通道恢复后续播。

          ### 本次修正

          - Car+ 启动对齐旧 ColorPlay：优先显式 CarlifeActivity 并指定手机主屏 display 0，不回退到智慧车载总设置页或引导页面。
          - 保留 CONTROL_READY 后延迟启动、停止/断开/旧引擎取消及自动一次预算；新增受当前会话与前台生命周期门禁保护的手动启动按钮。
          - 设置页显示入口诊断，当前进程有界诊断独立于详细日志开关加入导出；启动请求不等于实际音视频成功。
          - 用户实测反馈：一加16 / ColorOS17 + 君用 T2，通用（0.27）档案 + Car+，本批 0.2.16/217 不打开应用上车也可自动连接并弹出画面，音频与触摸正常；不代表其他设备或所有恢复场景均已验证。
          - 使用原正式证书，可覆盖 0.2.15/216；安装编号统一读取 version.properties，同批验证代码不再升号。
          - 兼容逻辑隔离在 carplus 适配层，仅保留少量上游接入点，未修改 Rust/JNI、通用盒子连接或蓝牙唤醒链。上游基线（直接读取本次提交的 UpstreamBase.kt）：${UPSTREAM_BASE}。

          ### 使用要求与适配状态

          - Android 13+、arm64-v8a；自绘模式需要 Shizuku 用于虚拟屏与相关操作。Car+ 使用已导出的系统入口，不强制要求 Shizuku，系统限制后台启动时需手动打开。
          - 安装高德地图或百度地图；音乐卡片需授予通知使用权，并安装受支持的音乐播放器。
          - 接收端需支持无线 Apple CarPlay。BMW MGU-55 / iD8.5 为实车开发基准，WinPlay 用于联调；其他车型档案不代表已实车验证。
          - 分辨率优先采用车机 /info 像素尺寸，无有效上报时使用设置兜底。使用原生尺寸并做偶数对齐，默认 60 fps，仍可手动选择较低帧率，下次连接生效；UI 按上报安全区域布局。
          - 已移除编码输出端的预测帧抽帧，切源后等待关键帧；偶发红绿斑块仍需具体车机长期复测。高德升级后车联入口也需复验。

          截图、使用说明与架构：https://github.com/${REPO}/blob/${GITHUB_SHA}/README.md

          | 项 | 值 |
          |---|---|
          | APK | ${NAME} |
          | 大小 | ${SIZE} |
          | SHA-256 | ${SHA} |
          | 签名证书 SHA-256 | ${CERT} |

          安装：adb install -r ${NAME}

          > 使用相同正式签名且 versionCode 不低于已安装版本时可覆盖安装。本地与 CI 均读取仓库 version.properties；重复构建不递增，发布前统一升级显示版本和安装编号。
          EOF

          # 授权分页列表能看到草稿；不能用按 tag 读取接口预判草稿不存在。
          python3 - <<'PYPREFLIGHT'
          import json, os, subprocess
          from pathlib import Path
          matches = []
          page = 1
          while True:
              releases = json.loads(subprocess.check_output(['gh', 'api', f"repos/{os.environ['REPO']}/releases?per_page=100&page={page}"], text=True))
              matches.extend(item for item in releases if item['tag_name'] == os.environ['TAG'])
              if len(releases) < 100:
                  break
              page += 1
          if len(matches) > 1:
              raise SystemExit('同名 Release 不唯一，请人工处理')
          if matches and matches[0]['draft']:
              raise SystemExit('同名草稿已存在，请人工核查，禁止覆盖或自动公开')
          Path('existing-release.json').write_text(json.dumps(matches[0] if matches else None))
          PYPREFLIGHT

          # 两次执行同一校验：既有公开版本必须完全一致才可跳过；创建后也须证实上传完成。
          cat > "$RUNNER_TEMP/verify-manual-release.py" <<'PYRELEASE'
          import hashlib, json, os, subprocess
          from pathlib import Path
          release = json.loads(Path('existing-release.json').read_text())
          def require(condition, message):
              if not condition:
                  raise SystemExit(message)
          require(release['tag_name'] == os.environ['TAG'], 'Release tag 不匹配')
          require(not release['draft'] and not release['prerelease'] and release.get('published_at'), 'Release 尚未正式公开')
          require(release.get('target_commitish') == os.environ['GITHUB_SHA'], '候选提交 SHA 不匹配，需人工核查')
          refs = subprocess.check_output(['git', 'ls-remote', 'origin', f"refs/tags/{os.environ['TAG']}", f"refs/tags/{os.environ['TAG']}^{{}}"], text=True).splitlines()
          peeled = [line.split()[0] for line in refs if line.endswith('^{}')]
          commits = peeled or [line.split()[0] for line in refs]
          require(len(commits) == 1 and commits[0] == os.environ['GITHUB_SHA'], '远程 tag 不指向本次提交')
          name = os.environ['NAME']
          local = Path(name).read_bytes()
          digest = hashlib.sha256(local).hexdigest()
          require(digest == os.environ['SHA'], '本地 APK SHA 不匹配')
          require(Path(name + '.sha256').read_text() == f'{digest}  {name}\n', '本地校验附件不匹配')
          for asset_name in (name, name + '.sha256'):
              assets = [asset for asset in release['assets'] if asset['name'] == asset_name]
              require(len(assets) == 1 and assets[0]['state'] == 'uploaded', '附件缺失、重复或未上传完成')
              asset = assets[0]
              expected = hashlib.sha256(Path(asset_name).read_bytes()).hexdigest()
              require(asset.get('digest') == 'sha256:' + expected, 'GitHub 附件 digest 不匹配')
              downloaded = subprocess.check_output(['gh', 'api', '-H', 'Accept: application/octet-stream', f"repos/{os.environ['REPO']}/releases/assets/{asset['id']}"])
              require(hashlib.sha256(downloaded).hexdigest() == expected, '下载附件 SHA 不匹配')
          PYRELEASE
          if [ "$(< existing-release.json)" != "null" ]; then
            python3 "$RUNNER_TEMP/verify-manual-release.py"
            echo '同名公开版本与候选提交及本地附件完全一致，安全跳过创建'
          else
            gh release create "$TAG" "$NAME" "$NAME.sha256" \
              --repo "$REPO" --target "$GITHUB_SHA" \
              --title "ColorPlay Next ${VERSION}" --notes-file notes.md --latest
          fi
          gh api "repos/$REPO/releases/tags/$TAG" > existing-release.json
          python3 "$RUNNER_TEMP/verify-manual-release.py"
          python3 -c 'import json, os; open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(json.load(open("existing-release.json"))["html_url"] + "\n")'

      - name: 正式版发布成功后同步并启动 Alpha
        if: steps.meta.outputs.publish == 'true' && github.ref == 'refs/heads/main' && steps.version.outputs.name == '0.2.12'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          # 用户授权顺序：正式版真实可下载后，才同步 Alpha。任何一步失败立即停止。
          gh api "repos/$REPO/releases/tags/$TAG" > "$RUNNER_TEMP/stable-release.json"
          python3 - <<'PYVERIFY'
          import json, os
          from pathlib import Path
          release = json.loads(Path(os.environ['RUNNER_TEMP'], 'stable-release.json').read_text())
          assert release['tag_name'] == os.environ['TAG']
          assert not release['draft'] and not release['prerelease']
          assert release['name'] == 'ColorPlay Next ' + os.environ['VERSION']
          assert any(a['name'].endswith('.apk') and a['state'] == 'uploaded' for a in release['assets'])
          PYVERIFY
          git fetch origin main alpha --unshallow || git fetch origin main alpha
          # 必须仍是本次发布的 main，不能把后来未发布的代码同步到 Alpha。
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B alpha origin/alpha
          git merge --no-edit "$GITHUB_SHA"
          git push origin HEAD:refs/heads/alpha
          gh workflow run alpha-upstream.yml --repo "$REPO" --ref main
          echo '正式版已发布；随后同步 alpha 并触发独立测试/预发布工作流。' >> "$GITHUB_STEP_SUMMARY"

      - name: 上传测试报告（失败时便于定位）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

